  <rect width="440" height="440" fill="none" stroke="#d8d6d2" stroke-width="1"/>
  <text y="464" font-size="12.5" fill="#4b5a50">9 cells carry volume; the largest holds 540 gallons.</text>
</g>
<g transform="translate(40 646)" font-size="12.5" fill="#101a14">
  <text y="0">For this mission, 93% of the recorded gallons change cell between the two readings, and 8 of its 9 track cells are empty under the first-waypoint reading.</text>
  <text y="20">Across the whole record at 3 km those figures are 59% of the gallons and 63% of the track cells.</text>
  <text y="44" fill="#4b5a50">Source: HERBS tape (Stellman et al., 2003), via hea-v at commit cb5948b.</text>
</g>
</svg>