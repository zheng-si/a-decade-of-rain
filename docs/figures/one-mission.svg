<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="706" viewBox="0 0 1020 706" font-family="Geist, 'Public Sans', 'Helvetica Neue', Arial, sans-serif">
<defs><clipPath id="clip"><rect width="440" height="440"/></clipPath></defs>
<rect width="1020" height="706" fill="#ffffff"/>
<text x="40" y="40" font-size="24" font-weight="600" fill="#101a14">One mission, two readings</text>
<text x="40" y="66" font-size="14" fill="#4b5a50">HERBS mission 3985, 22 May 1968: 3,000 gallons recorded on its 1A row, 2 tracks, 16.2 km. The grid is the Atlas's 3 km cell; dot area is gallons.</text>
