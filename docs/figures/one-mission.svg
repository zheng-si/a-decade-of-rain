fill="none" stroke="#ff5449" stroke-width="0.9" stroke-opacity="0.6"/><path d="M95.3 200.4L224.9 320.2" fill="none" stroke="#101a14" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/><path d="M332.4 215.1L195.6 88.0" fill="none" stroke="#101a14" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/><circle cx="95.3" cy="200.4" r="2.6" fill="#101a14"/><text x="71.3" y="216.4" font-size="11.5" font-weight="600" fill="#101a14">1A</text></g>
  <rect width="440" height="440" fill="none" stroke="#d8d6d2" stroke-width="1"/>
  <text y="464" font-size="12.5" fill="#4b5a50">1 cell carries volume: 3,000 gallons. Rings mark the 8 track cells left empty.</text>
</g>
<g transform="translate(540 150)">
  <text x="0" y="-40" font-size="12" fill="#4b5a50">Track-based reconstruction</text>
  <text x="0" y="-18" font-size="17" font-weight="600" fill="#101a14">The same volume spread along the tracks</text>
  <rect width="440" height="440" fill="#f4f2f1"/>
  <g clip-path="url(#clip)"><line x1="0.0" y1="0" x2="0.0" y2="440" stroke="#d8d6d2" stroke-width="1"/><line x1="0" y1="0.0" x2="440" y2="0.0" stroke="#d8d6d2" stroke-width="1"/><line x1="73.3" y1="0" x2="73.3" y2="440" stroke="#d8d6d2" stroke-width="1"/><line x1="0" y1="73.3" x2="440" y2="73.3" stroke="#d8d6d2" stroke-width="1"/><line x1="146.7" y1="0" x2="146.7" y2="440" stroke="#d8d6d2" stroke-width="1"/><line x1="0" y1="146.7" x2="440" y2="146.7" stroke="#d8d6d2" stroke-width="1"/><line x1="220.0" y1="0" x2="220.0" y2="440" stroke="#d8d6d2" stroke-width="1"/><line x1="0" y1="220.0" x2="440" y2="220.0" stroke="#d8d6d2" stroke-width="1"/><line x1="293.3" y1="0" x2="293.3" y2="440" stroke="#d8d6d2" stroke-width="1"/><line x1="0" y1="293.3" x2="440" y2="293.3" stroke="#d8d6d2" stroke-width="1"/><line x1="366.7" y1="0" x2="366.7" y2="440" stroke="#d8d6d2" stroke-width="1"/><line x1="0" y1="366.7" x2="440" y2="366.7" stroke="#d8d6d2" stroke-width="1"/><line x1="440.0" y1="0" x2="440.0" y2="440" stroke="#d8d6d2" stroke-width="1"/><line x1="0" y1="440.0" x2="440" y2="440.0" stroke="#d8d6d2" stroke-width="1"/><circle cx="183.3" cy="256.7" r="9.76" fill="#ff5449" fill-opacity="0.62"/><circle cx="330.0" cy="183.3" r="8.82" fill="#ff5449" fill-opacity="0.62"/><circle cx="256.7" cy="110.0" r="8.82" fill="#ff5449" fill-opacity="0.62"/><circle cx="256.7" cy="183.3" r="8.25" fill="#ff5449" fill-opacity="0.62"/><circle cx="110.0" cy="256.7" r="8.16" fill="#ff5449" fill-opacity="0.62"/><circle cx="183.3" cy="110.0" r="6.97" fill="#ff5449" fill-opacity="0.62"/><circle cx="183.3" cy="330.0" r="6.90" fill="#ff5449" fill-opacity="0.62"/><circle cx="110.0" cy="183.3" r="6.17" fill="#ff5449" fill-opacity="0.62"/><circle cx="256.7" cy="330.0" r="3.09" fill="#ff5449" fill-opacity="0.62"/><path d="M95.3 200.4L224.9 320.2" fill="none" stroke="#101a14" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round" stroke-linejoin="round"/><path d="M332.4 215.1L195.6 88.0" fill="none" strok