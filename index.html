<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff5449" />
    <title>A Decade of Rain · Agent Orange over Vietnam, 1961–1971</title>
    <meta
      name="description"
      content="An interactive story of Agent Orange in Vietnam: ten years of herbicide spraying mapped mission by mission, the land and lives it broke, and the decades-long cleanup still under way."
    />
    <link rel="canonical" href="https://adecadeofrain.sizheng.me/" />

    <!-- Theme before first paint (no flash): stored choice, else the reader's
         system preference. Kept in sync by src/theme.ts. -->
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('adr-theme')
          if (t !== 'dark' && t !== 'light')
            t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          document.documentElement.dataset.theme = t
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="A Decade of Rain" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://adecadeofrain.sizheng.me/" />
    <meta property="og:title" content="A Decade of Rain · Agent Orange over Vietnam, 1961–1971" />
    <meta
      property="og:description"
      content="An interactive story of Agent Orange in Vietnam: ten years of spraying mapped mission by mission, the land and lives it broke, and the decades-long cleanup still under way."
